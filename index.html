<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ethereal jungle</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #04060a; font-family: ui-monospace, Menlo, monospace; color: #cfe3d8; }
      /* canvas is a replaced element: inset alone doesn't stretch it */
      #scene { position: fixed; inset: 0; width: 100%; height: 100%; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(4, 6, 10, 0.92); z-index: 10; cursor: pointer; flex-direction: column; gap: 1rem;
      }
      #overlay h1 { font-weight: 400; letter-spacing: 0.4em; font-size: 1rem; opacity: 0.8; }
      #overlay p { opacity: 0.4; font-size: 0.75rem; }
      #panel {
        position: fixed; right: 0.75rem; top: 0.75rem; z-index: 5; width: 220px;
        background: rgba(8, 12, 18, 0.82); border: 1px solid #1c2a33; border-radius: 8px; padding: 0.8rem;
        display: flex; flex-direction: column; gap: 0.55rem; font-size: 0.7rem;
        max-height: calc(100vh - 1.5rem); overflow-y: auto; /* the rail outgrew the viewport */
      }
      #panel label { display: flex; flex-direction: column; gap: 0.2rem; opacity: 0.85; }
      #panel input[type="range"] { width: 100%; accent-color: #6fae8f; }
      #panel .row { display: flex; gap: 0.5rem; align-items: center; }
      #panel input[type="number"] { width: 5.5em; background: #0b1218; color: inherit; border: 1px solid #1c2a33; border-radius: 4px; padding: 2px 4px; }
      #panel button { background: #12202a; color: inherit; border: 1px solid #24404d; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
      #panel button.learn { padding: 0 5px; font-size: 0.6rem; opacity: 0.55; align-self: flex-end; }
      #panel hr { border: 0; border-top: 1px solid #1c2a33; margin: 0.1rem 0; width: 100%; }
      /* rotary dials (D21): the filters read as knobs, like the mixer they ape */
      #panel .dials { justify-content: space-around; padding: 0.15rem 0 0.05rem; }
      #panel label.dial { flex-direction: column; align-items: center; gap: 0.15rem; }
      #panel .knob-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
      #panel .hz { opacity: 0.5; font-size: 0.6rem; font-variant-numeric: tabular-nums; }
      svg.knob { display: block; cursor: ns-resize; touch-action: none; }
      svg.knob:focus { outline: none; }
      svg.knob:focus .knob-track { stroke: #2f4756; }
      .knob-track { fill: none; stroke: #23343f; stroke-width: 4; stroke-linecap: round; }
      .knob-val { fill: none; stroke: #6fae8f; stroke-width: 4; stroke-linecap: round; }
      .knob-pin { stroke: #cfe3d8; stroke-width: 2; stroke-linecap: round; }
      svg.knob.turning .knob-val, svg.knob:focus .knob-val { stroke: #8fd0ab; }
      #panel .wrap { flex-wrap: wrap; gap: 0.3rem; }
      #panel .wrap button { padding: 2px 6px; font-size: 0.62rem; }
      #readout { opacity: 0.55; white-space: pre; line-height: 1.5; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="panel">
      <label>tension override <span class="row"><input id="tensionMix" type="range" min="0" max="1" step="0.01" value="0" /></span></label>
      <label>tension (manual) <input id="tension" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
      <label>brightness override <input id="brightnessMix" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>brightness (manual) <input id="brightness" type="range" min="0" max="1" step="0.01" value="0.7" /></label>
      <label>wildness <input id="wildness" type="range" min="0" max="1" step="0.01" value="0.35" /></label>
      <label>coupling (sidechain) <input id="coupling" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
      <label>rain density <input id="rainDensity" type="range" min="0" max="1" step="0.01" value="0.55" /></label>
      <hr />
      <div class="row dials">
        <label class="dial">lpf <input id="lpf" type="range" min="0" max="1" step="0.005" value="1" /><span class="hz" id="lpfHz"></span></label>
        <label class="dial">hpf <input id="hpf" type="range" min="0" max="1" step="0.005" value="0" /><span class="hz" id="hpfHz"></span></label>
      </div>
      <label>echo <input id="echo" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>crush <input id="crush" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>space (reverb wash) <input id="space" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <hr />
      <label>eq low (kill) <input id="eqLow" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>eq mid (kill) <input id="eqMid" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>eq high (kill) <input id="eqHigh" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>gate (8ths) <input id="gate" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>drive <input id="drive" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <label>roll (drums &#215;2 &#215;3 &#215;4) <input id="roll" type="range" min="0" max="1" step="0.25" value="0" /></label>
      <hr />
      <div class="row">
        <label>seed <input id="seed" type="number" value="1" min="0" step="1" /></label>
        <button id="reroll">reroll</button>
      </div>
      <label>skip to track <span class="row wrap" id="tracks"></span></label>
      <label>skip to section <span class="row wrap" id="sections"></span></label>
      <div class="row">
        <button id="toggle">stop</button>
      </div>
      <div id="readout"></div>
    </div>
    <div id="overlay">
      <h1>ETHEREAL JUNGLE</h1>
      <p>click to wake the audio context</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
